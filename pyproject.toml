[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-toolkit"
dynamic = ["version"]
description = "Validate, inspect, organize and reconcile Brazilian e-invoice (NF-e/NFC-e) XML files. Zero-dependency Python CLI and library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Souza" }]
keywords = ["nfe", "nfce", "sefaz", "xml", "invoice", "brazil", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
nfe-toolkit = "nfe_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/gavicoding/nfe-toolkit"
Issues = "https://github.com/gavicoding/nfe-toolkit/issues"

[tool.setuptools.dynamic]
version = { attr = "nfe_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
